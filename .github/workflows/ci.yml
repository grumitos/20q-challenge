name: CI

on:
  # main takes a commit only once this check passed on it, in a branch first.
  push:
  # update.yml starts it: pushes made with GITHUB_TOKEN start no workflow.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          cache: npm

      - run: npm ci --no-audit --no-fund
      - run: npm run verify
      - run: npm audit --omit=dev --audit-level=high
