name: Deploy VPS

# The VPS side of 20q (deploy/, vps/, lib/, db/ and drizzle/ of a main commit) through
# app-release's forced commands for ci-20q. Cloudflare Pages serves the page on its own.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Deploy an exact main revision or roll back to an existing release.
        required: true
        default: deploy
        type: choice
        options:
          - deploy
          - rollback
      target_sha:
        description: Exact 40-character commit SHA to deploy or restore.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-20q-production
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    steps:
      - name: Check out main history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Ship the release
        env:
          MODE: ${{ inputs.mode }}
          TARGET_SHA: ${{ inputs.target_sha }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY_B64: ${{ secrets.VPS_SSH_KEY_B64 }}
          VPS_SSH_KNOWN_HOSTS_B64: ${{ secrets.VPS_SSH_KNOWN_HOSTS_B64 }}
        run: |
          set -euo pipefail
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          install -m 700 -d ~/.ssh
          printf '%s' "$VPS_SSH_KEY_B64" | base64 --decode > ~/.ssh/id_ed25519
          printf '%s' "$VPS_SSH_KNOWN_HOSTS_B64" | base64 --decode > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519
          vps() { ssh -p "$VPS_PORT" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" "$@"; }
          if [ "$MODE" = deploy ]; then
            # main holds only commits whose CI passed.
            git merge-base --is-ancestor "$TARGET_SHA" HEAD || { echo "Only revisions reachable from main may be deployed." >&2; exit 1; }
            git archive --format=tar --prefix=app/ "$TARGET_SHA" deploy vps lib db drizzle | gzip -n > app.tar.gz
            sum="$(sha256sum app.tar.gz | cut -d' ' -f1)"
            vps "upload $TARGET_SHA $sum" < app.tar.gz
            vps "deploy $TARGET_SHA $sum"
          else
            vps "rollback $TARGET_SHA"
          fi
          vps "verify $TARGET_SHA"
          echo "### 20q $MODE \`$TARGET_SHA\`" >> "$GITHUB_STEP_SUMMARY"
